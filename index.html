<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Manager</title>
    <style>
        :root {
            /* Deep Purple Neon */
            --neon-purple: #7800ff; 
            --neon-purple-glow: 0 0 10px rgba(120, 0, 255, 0.6), 0 0 20px rgba(120, 0, 255, 0.4);
            
            /* Glassmorphism settings */
            --glass-bg: rgba(15, 15, 15, 0.6);
            --glass-border: rgba(120, 0, 255, 0.25);
            
            /* Base Colors */
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }

        /* Sidebar for Categories */
        .sidebar {
            width: 300px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            z-index: 10;
        }

        .sidebar h2 {
            margin-top: 0;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(120, 0, 255, 0.5);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Inputs and Buttons */
        input, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--neon-purple);
            box-shadow: var(--neon-purple-glow);
            background: rgba(15, 15, 15, 0.8);
        }

        button {
            background: transparent;
            color: var(--neon-purple);
            border: 1px solid var(--neon-purple);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(120, 0, 255, 0.3);
        }

        button:hover {
            background: var(--neon-purple);
            color: #ffffff;
            box-shadow: var(--neon-purple-glow);
            text-shadow: none;
        }

        /* Sidebar Sections Divider */
        .sidebar-section {
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px dashed var(--glass-border);
        }

        /* Category List */
        .category-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
            overflow-y: auto;
        }

        .category-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-item:hover {
            background: rgba(120, 0, 255, 0.1);
            color: var(--text-main);
        }

        .category-item.active {
            background: rgba(120, 0, 255, 0.15);
            color: var(--text-main);
            border-left: 3px solid var(--neon-purple);
            box-shadow: inset 5px 0 10px -5px rgba(120, 0, 255, 0.3);
        }
        
        .delete-cat-btn {
            background: transparent !important;
            border: none !important;
            color: rgba(255, 50, 50, 0.5) !important;
            padding: 0 5px !important;
            font-size: 18px !important;
            box-shadow: none !important;
            text-shadow: none !important;
            line-height: 1;
        }
        
        .delete-cat-btn:hover {
            color: #ff6b6b !important;
            text-shadow: 0 0 8px rgba(255, 50, 50, 0.5) !important;
        }

        /* Response Cards */
        .response-card {
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.3s ease;
        }
        
        .response-card:hover {
            border-color: rgba(120, 0, 255, 0.5);
        }

        .response-text {
            font-size: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .translation-text {
            font-size: 14px;
            color: #cccccc;
            border-top: 1px dashed var(--glass-border);
            padding-top: 12px;
            margin-top: 4px;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        
        .loading {
            font-size: 12px;
            color: var(--neon-purple);
            animation: pulse 1.5s infinite;
            text-shadow: 0 0 5px rgba(120, 0, 255, 0.5);
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="sidebar glass">
        <h2>Categories</h2>
        
        <!-- Category Search Bar -->
        <input type="text" id="categorySearchInput" placeholder="🔍 Search categories..." oninput="renderCategories()">
        
        <div class="sidebar-section">
            <input type="text" id="newCategoryInput" placeholder="New Category Name..." style="margin-top: 8px;">
            <button onclick="addCategory()" style="width: 100%;">Add Category</button>
        </div>
        
        <ul class="category-list" id="categoryList">
            <!-- Categories injected here by JS -->
        </ul>
    </div>

    <div class="main-content">
        <div class="glass" style="border-radius: 16px; padding: 24px; margin-bottom: 24px;" id="addResponseSection">
            <h2 style="margin-top: 0; text-shadow: 0 0 10px rgba(120, 0, 255, 0.5);" id="currentCategoryTitle">Select a category</h2>
            <textarea id="newResponseInput" rows="4" placeholder="Type or paste your response here... (Auto-translates between Arabic and English)"></textarea>
            <button onclick="addResponse()">Save Response</button>
            <span id="translatingStatus" class="loading" style="display: none; margin-left: 12px;">Translating...</span>
        </div>

        <!-- Response Search Bar -->
        <div id="searchSection" style="display: none; margin-bottom: 16px;">
            <input type="text" id="searchInput" placeholder="🔍 Search responses in this category..." oninput="renderResponses()" style="margin-bottom: 0;">
        </div>

        <div id="responsesContainer">
            <!-- Responses injected here by JS -->
        </div>
    </div>

    <script>
        // State Management
        let data = JSON.parse(localStorage.getItem('responseManagerData')) || { categories: [] };
        let activeCategoryId = null;

        // Utility: Check if text contains Arabic characters
        function containsArabic(text) {
            const arabicPattern = /[\u0600-\u06FF]/;
            return arabicPattern.test(text);
        }

        // Free Translation API (MyMemory) - NO OPENAI
        async function translateText(text, langpair) {
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`);
                const result = await response.json();
                return result.responseData.translatedText;
            } catch (error) {
                console.error("Translation failed:", error);
                return "Translation failed. Please check your connection.";
            }
        }

        // Save to Local Storage
        function saveData() {
            localStorage.setItem('responseManagerData', JSON.stringify(data));
        }

        // Render Categories (with Search Filter)
        function renderCategories() {
            const list = document.getElementById('categoryList');
            list.innerHTML = '';
            
            // Get category search query
            const categorySearchQuery = document.getElementById('categorySearchInput').value.toLowerCase();
            
            // Filter categories based on search
            const filteredCategories = data.categories.filter(category => 
                category.name.toLowerCase().includes(categorySearchQuery)
            );
            
            if (filteredCategories.length === 0 && categorySearchQuery !== '') {
                list.innerHTML = '<li style="color: var(--text-muted); text-align: center; padding: 12px; font-size: 14px;">No categories found.</li>';
                return;
            }
            
            filteredCategories.forEach(category => {
                const li = document.createElement('li');
                li.className = `category-item ${activeCategoryId === category.id ? 'active' : ''}`;
                li.onclick = () => selectCategory(category.id);
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = category.name;
                li.appendChild(nameSpan);
                
                const delBtn = document.createElement('button');
                delBtn.innerHTML = '&times;';
                delBtn.className = 'delete-cat-btn';
                delBtn.title = 'Delete Category';
                delBtn.onclick = (e) => {
                    e.stopPropagation(); // Prevents triggering the category selection
                    deleteCategory(category.id);
                };
                li.appendChild(delBtn);

                list.appendChild(li);
            });
        }

        // Add New Category
        function addCategory() {
            const input = document.getElementById('newCategoryInput');
            const name = input.value.trim();
            if (!name) return;

            const newCategory = {
                id: Date.now().toString(),
                name: name,
                responses: []
            };

            data.categories.push(newCategory);
            saveData();
            input.value = '';
            
            // Clear the search filter when adding a new category so we can see it
            document.getElementById('categorySearchInput').value = '';
            
            if (!activeCategoryId) {
                selectCategory(newCategory.id);
            } else {
                renderCategories();
            }
        }
        
        // Delete Category
        function deleteCategory(id) {
            if (confirm("Are you sure you want to delete this category and all of its responses?")) {
                data.categories = data.categories.filter(c => c.id !== id);
                
                // If we deleted the category we were currently looking at, switch to another one
                if (activeCategoryId === id) {
                    if (data.categories.length > 0) {
                        activeCategoryId = data.categories[0].id;
                    } else {
                        activeCategoryId = null;
                        document.getElementById('currentCategoryTitle').textContent = "Select a category";
                        document.getElementById('responsesContainer').innerHTML = '';
                        document.getElementById('searchSection').style.display = 'none';
                    }
                }
                
                saveData();
                renderCategories();
                
                if (activeCategoryId) {
                    selectCategory(activeCategoryId);
                }
            }
        }

        // Select Category
        function selectCategory(id) {
            activeCategoryId = id;
            const category = data.categories.find(c => c.id === id);
            if(category) {
                document.getElementById('currentCategoryTitle').textContent = `Add to: ${category.name}`;
            }
            
            // Clear the response search bar when switching categories
            document.getElementById('searchInput').value = '';
            
            renderCategories();
            renderResponses();
        }

        // Add Response (with bidirectional auto-translation)
        async function addResponse() {
            if (!activeCategoryId) {
                alert("Please select or create a category first.");
                return;
            }

            const input = document.getElementById('newResponseInput');
            const text = input.value.trim();
            if (!text) return;

            const category = data.categories.find(c => c.id === activeCategoryId);
            const statusEl = document.getElementById('translatingStatus');
            
            let translatedText = null;
            let translationLang = '';
            const isArabic = containsArabic(text);

            // Determine direction
            statusEl.style.display = 'inline-block';
            if (isArabic) {
                statusEl.textContent = 'Translating to English...';
                translatedText = await translateText(text, 'ar|en');
                translationLang = 'English';
            } else {
                statusEl.textContent = 'Translating to Arabic...';
                translatedText = await translateText(text, 'en|ar');
                translationLang = 'Arabic';
            }
            statusEl.style.display = 'none';

            const newResponse = {
                id: Date.now().toString(),
                original: text,
                isOriginalArabic: isArabic,
                translated: translatedText,
                translationLang: translationLang
            };

            category.responses.unshift(newResponse); 
            saveData();
            input.value = '';
            
            // Clear the search input so the new response shows up instantly
            document.getElementById('searchInput').value = ''; 
            
            renderResponses();
        }

        // Render Responses for Active Category (with Search Filter)
        function renderResponses() {
            const container = document.getElementById('responsesContainer');
            const searchSection = document.getElementById('searchSection');
            
            container.innerHTML = '';
            
            if (!activeCategoryId) {
                searchSection.style.display = 'none';
                return;
            }

            const category = data.categories.find(c => c.id === activeCategoryId);
            if (!category) {
                searchSection.style.display = 'none';
                return;
            }

            // Show search bar only if category is active
            searchSection.style.display = 'block';

            // Get the current search query
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            // Filter responses based on search query
            const filteredResponses = category.responses.filter(res => {
                const originalText = res.original.toLowerCase();
                const translatedText = res.translated ? res.translated.toLowerCase() : '';
                return originalText.includes(searchQuery) || translatedText.includes(searchQuery);
            });

            // Show a message if no results match the search
            if (filteredResponses.length === 0 && searchQuery !== '') {
                container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">No matching responses found.</div>';
                return;
            }

            // Render the filtered responses
            filteredResponses.forEach(res => {
                const card = document.createElement('div');
                card.className = 'response-card glass';

                // Original text
                const origText = document.createElement('div');
                origText.className = 'response-text';
                origText.textContent = res.original;
                // Set RTL if original is Arabic
                if (res.isOriginalArabic) {
                    origText.style.direction = 'rtl';
                    origText.style.textAlign = 'right';
                }
                card.appendChild(origText);

                // Actions container
                const actions = document.createElement('div');
                actions.className = 'card-actions';

                // Copy Original Button
                const btnOriginal = document.createElement('button');
                btnOriginal.textContent = 'Copy Original';
                btnOriginal.onclick = () => copyToClipboard(res.original, btnOriginal);
                actions.appendChild(btnOriginal);

                // If translation exists, show it and add a copy button for it
                if (res.translated) {
                    const transText = document.createElement('div');
                    transText.className = 'translation-text';
                    transText.textContent = `${res.translationLang}: ${res.translated}`;
                    
                    // Set RTL if the translation is Arabic
                    if (res.translationLang === 'Arabic') {
                        transText.style.direction = 'rtl';
                        transText.style.textAlign = 'right';
                    }
                    
                    card.appendChild(transText);

                    const btnTranslated = document.createElement('button');
                    btnTranslated.textContent = `Copy ${res.translationLang}`;
                    btnTranslated.onclick = () => copyToClipboard(res.translated, btnTranslated);
                    actions.appendChild(btnTranslated);
                }

                // Delete Button
                const btnDelete = document.createElement('button');
                btnDelete.textContent = 'Delete';
                btnDelete.style.borderColor = 'rgba(255, 50, 50, 0.4)';
                btnDelete.style.color = '#ff6b6b';
                btnDelete.style.marginLeft = 'auto'; // Push delete to the right
                btnDelete.onclick = () => {
                    category.responses = category.responses.filter(r => r.id !== res.id);
                    saveData();
                    renderResponses();
                };
                
                // Add hover effect specifically for the delete button
                btnDelete.onmouseover = () => {
                    btnDelete.style.background = 'rgba(255, 50, 50, 0.15)';
                    btnDelete.style.boxShadow = '0 0 10px rgba(255, 50, 50, 0.3)';
                };
                btnDelete.onmouseout = () => {
                    btnDelete.style.background = 'transparent';
                    btnDelete.style.boxShadow = 'none';
                };

                actions.appendChild(btnDelete);
                card.appendChild(actions);
                container.appendChild(card);
            });
        }

        // Copy to Clipboard Utility
        function copyToClipboard(text, buttonElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = buttonElement.textContent;
                buttonElement.textContent = 'Copied!';
                buttonElement.style.background = 'var(--neon-purple)';
                buttonElement.style.color = '#fff';
                buttonElement.style.textShadow = 'none';
                
                setTimeout(() => {
                    buttonElement.textContent = originalText;
                    buttonElement.style.background = 'transparent';
                    buttonElement.style.color = 'var(--neon-purple)';
                    buttonElement.style.textShadow = '0 0 5px rgba(120, 0, 255, 0.3)';
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Initialize App
        if (data.categories.length > 0) {
            selectCategory(data.categories[0].id);
        } else {
            renderCategories();
        }
    </script>
</body>
</html>
